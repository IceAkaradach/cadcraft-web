  <script>
    // Precision viewport sync for iPad / Tablet / Mobile Safari
    function syncViewport() {
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      const canvas = document.getElementById('cadcraft_canvas');
      if (canvas) {
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
      }
      document.body.style.width = w + 'px';
      document.body.style.height = h + 'px';
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('orientationchange', () => {
      setTimeout(syncViewport, 80);
      setTimeout(syncViewport, 250);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('DOMContentLoaded', syncViewport);
    window.addEventListener('load', syncViewport);
    syncViewport();

    // Optimize for Stylus / Pen & Touch devices (Apple Pencil, Samsung S-Pen, Surface Pen)
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('contextmenu', (e) => {
      if (e.target && e.target.id === 'cadcraft_canvas') {
        e.preventDefault();
      }
    });
  </script>
